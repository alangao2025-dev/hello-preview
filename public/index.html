<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #fef3c7 0%, #fce7f3 50%, #dbeafe 100%);
      color: #1e293b;
    }
    .card { background: #fff; border-radius: 24px; padding: 48px 40px; text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.08); max-width: 440px; width: 90%; }
    h1 { font-size: 36px; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 24px; }
    .clock { font-size: 28px; font-variant-numeric: tabular-nums; margin-bottom: 24px; }
    button { border: 0; border-radius: 12px; padding: 12px 24px; font-size: 16px; cursor: pointer;
      background: #6366f1; color: #fff; }
    button:active { transform: scale(.97); }
    .count { margin-top: 16px; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, Preview 👋</h1>
    <p>这是通过 site-builder 自动发布的测试页面</p>
    <div class="clock" id="clock"></div>
    <button id="btn">点我</button>
    <div class="count" id="count">还没点过</div>
  </main>
  <script>
    const clock = document.getElementById("clock");
    const tick = () => (clock.textContent = new Date().toLocaleTimeString("zh-CN"));
    tick(); setInterval(tick, 1000);
    let n = 0;
    document.getElementById("btn").onclick = () => {
      document.getElementById("count").textContent = `已点击 ${++n} 次`;
    };
  </script>
</body>
</html>
